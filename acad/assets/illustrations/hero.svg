  <rect x="18.5" y="350.5" width="120" height="48" rx="24" fill="#FFFFFF" stroke="#D3E6DD"/>
  <g stroke="#FFFFFF" stroke-width="2">
    <circle cx="44" cy="374.5" r="14" fill="#C4F5DE"/>
    <circle cx="66" cy="374.5" r="14" fill="#EEF8F3"/>
    <circle cx="88" cy="374.5" r="14" fill="#8EEBC4"/>
