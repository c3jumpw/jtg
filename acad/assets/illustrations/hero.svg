  <circle cx="334" cy="179" r="6.5" fill="#D9A27A"/>
  <path d="M322 195 C 324 187, 344 187, 346 195" fill="#157A57"/>
  <rect x="364" y="172" width="76" height="9" rx="4.5" fill="#0F2A3A"/>
  <rect x="364" y="188" width="54" height="7" rx="3.5" fill="#D3E6DD"/>
  <rect x="452" y="175" width="40" height="18" rx="9" fill="#C4F5DE"/>
  <circle cx="463" cy="184" r="3.5" fill="#157A57"/>
  <rect x="470" y="181" width="14" height="6" rx="3" fill="#157A57" fill-opacity=".5"/>
  <path d="M316 216.5 H492" stroke="#D3E6DD"/>
  <g fill="#157A57">
    <circle cx="328" cy="238" r="10"/>
    <circle cx="328" cy="266" r="10"/>
    <circle cx="328" cy="294" r="10"/>
