  <rect x="248.5" y="236.5" width="104" height="160" rx="10" fill="#163447" stroke="#24465A"/>
  <rect x="42" y="226" width="112" height="14" rx="7" fill="#157A57"/>
  <rect x="246" y="226" width="112" height="14" rx="7" fill="#157A57"/>
  <!-- wing windows -->
  <g fill="#C4F5DE">
