  <path d="M190 274 V246 A10 10 0 0 1 210 246 V274 Z" fill="#C4F5DE" fill-opacity=".3"/>
  <path d="M220 274 V246 A10 10 0 0 1 240 246 V274 Z" fill="#C4F5DE"/>
  <rect x="172" y="294" width="56" height="10" rx="5" fill="#8EEBC4"/>
  <path d="M182 392 V338 A18 18 0 0 1 218 338 V392 Z" fill="#157A57"/>
  <path d="M200.5 322 V392" stroke="#24465A" stroke-width="2"/>
  <circle cx="194" cy="360" r="2" fill="#C4F5DE"/>
  <circle cx="207" cy="360" r="2" fill="#C4F5DE"/>
  <rect x="172" y="384" width="56" height="8" rx="2" fill="#163447"/>

