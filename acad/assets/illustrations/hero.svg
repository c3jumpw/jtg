    <rect x="106" y="260" width="28" height="32" rx="6" fill-opacity=".3"/>
    <rect x="66" y="306" width="28" height="32" rx="6" fill-opacity=".3"/>
    <rect x="106" y="306" width="28" height="32" rx="6"/>
    <rect x="266" y="260" width="28" height="32" rx="6" fill-opacity=".3"/>
