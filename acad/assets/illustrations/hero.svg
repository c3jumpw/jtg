<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" fill="none">
  <!-- A friendly academy front with a flag and clock, an enrollment application card with checked rows, a floating graduation cap and new students -->

  <g transform="translate(0 12)">
