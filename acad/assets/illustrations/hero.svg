  </g>

  <!-- sparkles -->
  <path d="M368 56 Q368 64 376 64 Q368 64 368 72 Q368 64 360 64 Q368 64 368 56 Z" fill="#8EEBC4"/>
  <path d="M518 128 Q518 134 524 134 Q518 134 518 140 Q518 134 512 134 Q518 134 518 128 Z" fill="#C4F5DE"/>
  <circle cx="512" cy="54" r="3" fill="#8EEBC4" fill-opacity=".6"/>
  <circle cx="92" cy="176" r="3" fill="#8EEBC4" fill-opacity=".6"/>
