  <circle cx="44" cy="370" r="5.5" fill="#A8714A"/>
  <path d="M35 384 C 37 377, 51 377, 53 384" fill="#157A57"/>
  <circle cx="66" cy="370" r="5.5" fill="#F1C7A5"/>
  <path d="M57 384 C 59 377, 73 377, 75 384" fill="#0F2A3A"/>
  <circle cx="88" cy="370" r="5.5" fill="#6E4630"/>
