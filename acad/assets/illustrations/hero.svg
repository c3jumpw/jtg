  <path d="M323.5 238.5 L327 242 L333 235 M323.5 266.5 L327 270 L333 263 M323.5 294.5 L327 298 L333 291" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="348" y="234" width="104" height="8" rx="4" fill="#D3E6DD"/>
  <rect x="348" y="262" width="84" height="8" rx="4" fill="#D3E6DD"/>
  <rect x="348" y="290" width="116" height="8" rx="4" fill="#D3E6DD"/>
  <rect x="316" y="320" width="176" height="8" rx="4" fill="#EEF8F3"/>
  <rect x="316" y="320" width="132" height="8" rx="4" fill="#8EEBC4"/>

