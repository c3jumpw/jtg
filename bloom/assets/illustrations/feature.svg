<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" fill="none">
  <!-- Growth in three stages: a bud, a half-open and a full tulip stand on rising columns, each holding more client avatars and a longer revenue bar, with a climbing-revenue chip -->

  <!-- rising columns -->
  <path d="M60 376 V312 A16 16 0 0 1 76 296 H156 A16 16 0 0 1 172 312 V376 Z" fill="#FFF2EB"/>
  <path d="M204 376 V264 A16 16 0 0 1 220 248 H300 A16 16 0 0 1 316 264 V376 Z" fill="#FFF2EB"/>
  <path d="M348 376 V216 A16 16 0 0 1 364 200 H444 A16 16 0 0 1 460 216 V376 Z" fill="#FFF2EB"/>
  <rect x="28" y="376" width="464" height="8" rx="4" fill="#F1DCD1"/>

  <!-- stage 1: one client -->
  <circle cx="88" cy="322" r="13" fill="#FFFFFF"/>
  <circle cx="88" cy="318" r="4.5" fill="#D9A27A"/>
  <path d="M80 330 C 82 324.5, 94 324.5, 96 330" fill="#F2591A"/>
  <rect x="76" y="346" width="80" height="8" rx="4" fill="#FFFFFF"/>
  <rect x="76" y="346" width="26" height="8" rx="4" fill="#F2591A"/>

  <!-- stage 2: two clients -->
  <circle cx="232" cy="274" r="13" fill="#FFFFFF"/>
  <circle cx="232" cy="270" r="4.5" fill="#6E4630"/>
  <path d="M224 282 C 226 276.5, 238 276.5, 240 282" fill="#12C27A"/>
  <circle cx="252" cy="274" r="13" fill="#FFFFFF"/>
  <circle cx="252" cy="270" r="4.5" fill="#F1C7A5"/>
  <path d="M244 282 C 246 276.5, 258 276.5, 260 282" fill="#F2591A"/>
  <rect x="220" y="298" width="80" height="8" rx="4" fill="#FFFFFF"/>
  <rect x="220" y="298" width="50" height="8" rx="4" fill="#F2591A"/>

  <!-- stage 3: a full book -->
  <circle cx="376" cy="226" r="13" fill="#FFFFFF"/>
  <circle cx="376" cy="222" r="4.5" fill="#A8714A"/>
  <path d="M368 234 C 370 228.5, 382 228.5, 384 234" fill="#FF8A57"/>
  <circle cx="396" cy="226" r="13" fill="#FFFFFF"/>
  <circle cx="396" cy="222" r="4.5" fill="#D9A27A"/>
  <path d="M388 234 C 390 228.5, 402 228.5, 404 234" fill="#12C27A"/>
  <circle cx="416" cy="226" r="13" fill="#FFFFFF"/>
  <circle cx="416" cy="222" r="4.5" fill="#6E4630"/>
  <path d="M408 234 C 410 228.5, 422 228.5, 424 234" fill="#F2591A"/>
  <circle cx="436" cy="226" r="9" fill="#F2591A"/>
  <path d="M436 222 V230 M432 226 H440" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <rect x="364" y="250" width="80" height="8" rx="4" fill="#F2591A"/>

  <!-- bud -->
  <path d="M116 296 V244" stroke="#0E9F5A" stroke-width="5" stroke-linecap="round"/>
  <path d="M115 290 C 96 286, 88 270, 92 256 C 106 262, 114 274, 115 290 Z" fill="#12C27A"/>
  <g transform="translate(116 246) scale(.5 .72)">
    <path d="M0 -86 C 16 -74, 24 -50, 20 -20 H-20 C -24 -50, -16 -74, 0 -86 Z" fill="#C2410C"/>
    <path d="M-30 -66 C -14 -62, 6 -40, 8 0 C -14 4, -30 -8, -34 -30 C -36 -44, -34 -56, -30 -66 Z" fill="#F2591A"/>
    <path d="M30 -66 C 14 -62, -6 -40, -8 0 C 14 4, 30 -8, 34 -30 C 36 -44, 34 -56, 30 -66 Z" fill="#FF8A57"/>
  </g>

  <!-- half open -->
  <path d="M260 248 V184" stroke="#0E9F5A" stroke-width="5" stroke-linecap="round"/>
  <path d="M259 240 C 232 234, 220 212, 226 192 C 246 200, 258 216, 259 240 Z" fill="#12C27A"/>
  <path d="M261 228 C 284 220, 294 200, 290 182 C 272 190, 262 206, 261 228 Z" fill="#0E9F5A"/>
  <g transform="translate(260 186) scale(.78)">
    <path d="M0 -86 C 16 -74, 24 -50, 20 -20 H-20 C -24 -50, -16 -74, 0 -86 Z" fill="#C2410C"/>
    <path d="M-34 -66 C -18 -62, 2 -40, 4 0 C -18 4, -34 -8, -38 -30 C -40 -44, -38 -56, -34 -66 Z" fill="#F2591A" transform="rotate(-6)"/>
    <path d="M34 -66 C 18 -62, -2 -40, -4 0 C 18 4, 34 -8, 38 -30 C 40 -44, 38 -56, 34 -66 Z" fill="#FF8A57" transform="rotate(6)"/>
  </g>

  <!-- full bloom -->
  <path d="M404 200 V122" stroke="#0E9F5A" stroke-width="5" stroke-linecap="round"/>
  <path d="M403 192 C 370 186, 354 158, 360 132 C 386 142, 402 162, 403 192 Z" fill="#12C27A"/>
  <path d="M405 178 C 434 170, 448 144, 442 120 C 420 130, 406 150, 405 178 Z" fill="#0E9F5A"/>
  <g transform="translate(404 126)">
    <path d="M0 -88 C 20 -70, 28 -44, 22 -10 H-22 C -28 -44, -20 -70, 0 -88 Z" fill="#C2410C"/>
    <path d="M4 0 C -26 2, -48 -20, -52 -64 C -28 -58, -6 -38, 4 0 Z" fill="#F2591A"/>
    <path d="M-4 0 C 26 2, 48 -20, 52 -64 C 28 -58, 6 -38, -4 0 Z" fill="#FF8A57"/>
  </g>
  <path d="M470 50 V62 M464 56 H476" stroke="#6EEB8F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M336 76 V84 M332 80 H340" stroke="#6EEB8F" stroke-width="2" stroke-linecap="round"/>

  <!-- revenue climbing chip -->
  <rect x="36" y="56" width="172" height="64" rx="14" fill="#231F20" fill-opacity=".08" transform="translate(0 6)"/>
  <rect x="36.5" y="56.5" width="172" height="64" rx="14" fill="#FFFFFF" stroke="#F1DCD1"/>
  <circle cx="68" cy="88.5" r="16" fill="#12C27A"/>
  <path d="M62 94 L68 88 L72 92 L77 85 M73 84.5 H77.5 V89" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="96" y="75" width="60" height="8" rx="4" fill="#231F20"/>
  <rect x="96" y="92" width="92" height="8" rx="4" fill="#FFF2EB"/>
  <rect x="96" y="92" width="70" height="8" rx="4" fill="#F2591A"/>
</svg>
