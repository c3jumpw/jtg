<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" fill="none">
  <!-- Three-step white-label flow: the client brief goes into the studio, where layered design cards take shape, and leaves as a packed set carrying the consultant's own tag -->

