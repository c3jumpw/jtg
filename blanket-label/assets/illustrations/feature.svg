  <circle cx="300" cy="134" r="4" fill="#5E6066"/>
  <path d="M302 126 C 326 76, 394 82, 404 150" stroke="#A3A5AA" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 7"/>
