    <path d="M26 0 H58 Q62 0 65 3 L81 19 Q84 22 84 26 V112 A12 12 0 0 1 72 124 H12 A12 12 0 0 1 0 112 V26 Q0 22 3 19 L19 3 Q22 0 26 0 Z" fill="#1D1D20"/>
    <circle cx="42" cy="22" r="9" fill="#5E6066"/>
